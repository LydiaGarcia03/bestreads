<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bestreads" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Bestreads</title>
    <!-- Open the connections the first search needs while the app loads (book APIs via CORS fetch, then covers). -->
    <link rel="preconnect" href="https://www.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://openlibrary.org" crossorigin />
    <link rel="preconnect" href="https://books.google.com" />
    <link rel="preconnect" href="https://covers.openlibrary.org" />
    <script>
      // Apply a manual theme before first paint to avoid a light flash. Mirrors applyTheme().
      try {
        var theme = localStorage.getItem('bestreads.theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
          var color = theme === 'dark' ? '#141414' : '#F4F1EA';
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.setAttribute('content', color);
          });
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
