<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bestreads mock — Book page — mobile, light</title>
<!-- Static UI reference for Bestreads. Not production code: rebuild with React + Tailwind tokens. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&amp;family=Lato:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F6B4F}a:hover{color:#1F4A36}
</style>
<style>body{margin:0;background:#8a8a8a;display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div style="width: 390px; height: 960px; box-sizing: border-box; background: #F4F1EA; font-family: Lato, sans-serif; color: #382110; display: flex; flex-direction: column; overflow: hidden">

<header style="height: 56px; flex: none; padding: 0 8px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #DDD5C7">
<button aria-label="Back" style="width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#382110" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<div style="font-family: Merriweather, serif; font-size: 15px; font-weight: 700">Book</div>
<button aria-label="Share rating card" style="width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#382110" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"></path></svg></button>
</header>

<main style="flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 20px">

<section style="display: flex; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px; align-items: center; flex: none">
<div style="width: 112px; height: 168px; background: #1E3A5F; border-radius: 3px; box-shadow: 0 6px 16px rgba(56,33,16,0.25)"></div>
<a href="#" style="font-size: 12px; font-weight: 700; text-decoration: none; padding: 6px 0">Change cover</a>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0">
<h1 style="margin: 0; font-family: Merriweather, serif; font-size: 22px; font-weight: 700; line-height: 1.2">Project Hail Mary</h1>
<div style="font-size: 14px; color: #6B5B4E">by Andy Weir</div>
<div style="font-size: 12px; color: #6B5B4E">496 pages · 2021</div>
<button style="margin-top: 8px; height: 40px; border-radius: 4px; border: none; background: #2F6B4F; color: #FFFFFF; font-family: Lato, sans-serif; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; cursor: pointer">Currently reading<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<span style="font-size: 12px; padding: 4px 10px; border-radius: 12px; border: 1px solid #C9BEAB; background: #FFFFFF">Sci-fi</span>
<button style="font-size: 12px; height: 26px; padding: 0 10px; border-radius: 13px; border: 1px dashed #A99C88; background: transparent; color: #382110; font-family: Lato, sans-serif">+ Shelf</button>
</div>
</div>
</section>

<section style="background: #FFFFFF; border: 1px solid #DDD5C7; border-radius: 6px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h2 style="margin: 0; font-family: Merriweather, serif; font-size: 15px; font-weight: 700">Progress</h2>
<div style="display: flex; border: 1px solid #C9BEAB; border-radius: 4px; overflow: hidden">
<button style="height: 30px; padding: 0 12px; border: none; background: #382110; color: #FFFFFF; font-family: Lato, sans-serif; font-size: 12px; font-weight: 700">Pages</button>
<button style="height: 30px; padding: 0 12px; border: none; background: #FFFFFF; color: #382110; font-family: Lato, sans-serif; font-size: 12px">%</button>
</div>
</div>
<div style="display: flex; align-items: center; gap: 8px; font-size: 14px">
<label style="display: flex; align-items: center; gap: 8px">I'm on page <input value="296" aria-label="Current page" style="width: 64px; height: 40px; box-sizing: border-box; border: 1px solid #C9BEAB; border-radius: 4px; text-align: center; font-family: Lato, sans-serif; font-size: 15px; font-weight: 700; color: #382110"></label>
<span style="color: #6B5B4E">of 496</span>
</div>
<div style="height: 8px; background: #EAE3D6; border-radius: 4px; overflow: hidden"><div style="width: 60%; height: 8px; background: #2F6B4F"></div></div>
<button style="align-self: flex-start; height: 36px; padding: 0 14px; border: 1px solid #2F6B4F; background: #FFFFFF; color: #2F6B4F; border-radius: 4px; font-family: Lato, sans-serif; font-size: 13px; font-weight: 700; cursor: pointer">Update progress</button>
</section>

<button style="width: 100%; min-height: 56px; border: 1px dashed #A99C88; border-radius: 6px; background: transparent; color: #382110; display: flex; align-items: center; gap: 12px; padding: 10px 14px; box-sizing: border-box; font-family: Lato, sans-serif; text-align: left; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#382110" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 700">Add reading plan</span><span style="font-size: 12px; color: #6B5B4E">Pages per day, time and a reminder</span></span>
<span style="font-size: 20px; color: #2F6B4F; font-weight: 700" aria-hidden="true">+</span>
</button>

<section style="background: #FFFFFF; border: 1px solid #DDD5C7; border-radius: 6px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center">
<h2 style="margin: 0; font-family: Merriweather, serif; font-size: 15px; font-weight: 700">My rating</h2>
<label style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #6B5B4E"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #2F6B4F">Public</label>
</div>
<div style="display: flex; gap: 4px">
<button aria-label="1 star" style="width: 44px; height: 44px; border: none; background: transparent; font-size: 30px; color: #A0521A; padding: 0">★</button>
<button aria-label="2 stars" style="width: 44px; height: 44px; border: none; background: transparent; font-size: 30px; color: #A0521A; padding: 0">★</button>
<button aria-label="3 stars" style="width: 44px; height: 44px; border: none; background: transparent; font-size: 30px; color: #A0521A; padding: 0">★</button>
<button aria-label="4 stars" style="width: 44px; height: 44px; border: none; background: transparent; font-size: 30px; padding: 0"><span style="position: relative; display: inline-block; color: #D6CBB8">★<span aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 75%; overflow: hidden; white-space: nowrap; display: block; color: #A0521A">★</span></span></button>
<button aria-label="5 stars" style="width: 44px; height: 44px; border: none; background: transparent; font-size: 30px; color: #D6CBB8; padding: 0">★</button>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div role="group" aria-label="Fine-tune rating" style="display: flex; align-items: center; gap: 2px; border: 1px solid #C9BEAB; border-radius: 999px; padding: 2px">
<button aria-label="Lower rating by 0.25" style="width: 40px; height: 40px; border-radius: 20px; border: none; background: transparent; color: #382110; font-size: 18px">−</button>
<span style="min-width: 48px; text-align: center; font-family: Merriweather, serif; font-size: 16px; font-weight: 700; color: #A0521A">3.75</span>
<button aria-label="Raise rating by 0.25" style="width: 40px; height: 40px; border-radius: 20px; border: none; background: transparent; color: #382110; font-size: 18px">+</button>
</div>
<div style="font-size: 12px; color: #6B5B4E; text-align: right">2 friends rated this<br>average 4.5</div>
</div>
</section>

<section style="background: #FFFFFF; border: 1px solid #DDD5C7; border-radius: 6px; padding: 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div><div style="font-size: 12px; color: #6B5B4E">Started</div><div style="font-size: 15px; font-weight: 700">Oct 28, 2026</div></div>
<div><div style="font-size: 12px; color: #6B5B4E">Finished</div><a href="#" style="font-size: 15px; font-weight: 700; text-decoration: none">Add date</a></div>
</section>

<section style="background: #FFFFFF; border: 1px solid #DDD5C7; border-radius: 6px; padding: 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0; font-family: Merriweather, serif; font-size: 15px; font-weight: 700">My review</h2>
<div style="display: flex; align-items: center; gap: 4px; font-size: 12px; color: #6B5B4E"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Only you can see this</div>
</div>
<button style="height: 44px; padding: 0 16px; border: 1px solid #2F6B4F; background: #FFFFFF; color: #2F6B4F; border-radius: 4px; font-family: Lato, sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; flex: none">Add review</button>
</section>
</main>
</div>
</body>
</html>
