<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shelves icon options</title>
<style>
  :root {
    --bg: #F4F1EA; --surface: #FFFFFF; --surface-muted: #ECE7DC; --border: #DED6C6;
    --fg: #382110; --fg-muted: #7A6A58; --accent: #2F6B4F;
  }
  :root[data-theme="dark"] {
    --bg: #141414; --surface: #1F1F1F; --surface-muted: #2A2A2A; --border: #2E2E2E;
    --fg: #EDE6DA; --fg-muted: #ABABAB; --accent: #F2B66D;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 Lato, system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid var(--border); background: var(--surface); }
  h1 { margin: 0; font: 700 20px Merriweather, Georgia, serif; }
  header p { margin: 4px 0 0; color: var(--fg-muted); font-size: 13px; }
  button.theme { height: 40px; padding: 0 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--fg); font: inherit; cursor: pointer; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; padding: 24px; max-width: 1280px; margin: 0 auto; }
  .card { display: flex; flex-direction: column; gap: 14px; padding: 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  .card h2 { margin: 0; font: 700 15px Merriweather, Georgia, serif; }
  .card h2 span { color: var(--accent); margin-right: 6px; }
  .card p { margin: 0; color: var(--fg-muted); font-size: 13px; }
  .big { display: flex; align-items: center; justify-content: center; height: 112px; border-radius: 8px; background: var(--bg); }
  .preview { display: flex; gap: 12px; align-items: stretch; }
  /* Desktop side menu item */
  .side { flex: 1; display: flex; flex-direction: column; gap: 2px; padding: 6px; border-radius: 8px; background: var(--bg); }
  .item { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border-radius: 6px; font-size: 14px; color: var(--fg); }
  .item.active { background: var(--surface-muted); color: var(--accent); font-weight: 700; }
  /* Mobile bottom tab */
  .tabs { display: flex; border-radius: 8px; background: var(--bg); }
  .tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 64px; font-size: 11px; color: var(--fg-muted); }
  .tab.active { color: var(--accent); font-weight: 700; }
  svg { display: block; flex-shrink: 0; }
  @media (max-width: 420px) { main { padding: 16px; } header { padding: 16px; } }
</style>
</head>
<body>
<header>
  <div>
    <h1>Shelves icon options</h1>
    <p>Each option is shown large, in the desktop side menu (normal and active) and in the mobile tab bar. Pick one by its letter.</p>
  </div>
  <button class="theme" type="button" id="themeToggle">Switch to dark theme</button>
</header>
<main id="options"></main>

<script>
  // 24×24 stroke icons, same settings as src/shared/ui/icons.tsx (stroke 2, round caps and joins).
  const OPTIONS = [
    {
      id: 'A', name: 'Stack of books (current)',
      note: 'Three books lying down, different lengths, a band on each spine.',
      svg: '<rect x="3" y="16" width="18" height="5" rx="1"/><rect x="5" y="11" width="15" height="5" rx="1"/><rect x="4" y="6" width="13" height="5" rx="1"/><path d="M7 16v5M16.5 11v5M7.5 6v5"/>',
    },
    {
      id: 'B', name: 'Stack with a tilted top book',
      note: 'Same stack, top book slightly turned: more casual, less blocky.',
      svg: '<rect x="3" y="16" width="18" height="5" rx="1"/><rect x="5" y="11" width="14" height="5" rx="1"/><rect x="5.5" y="5.5" width="12" height="5" rx="1" transform="rotate(-9 11.5 8)"/><path d="M7 16v5M15.5 11v5"/>',
    },
    {
      id: 'C', name: 'Books on a shelf, one leaning',
      note: 'Two upright spines and one leaning book on a shelf line. Close to the logo.',
      svg: '<path d="M2.5 21h19"/><path d="M5 21V7h3.5v14M10 21V4h3.5v17"/><path d="M15.5 21l2.6-12.5 3.2.7-2.5 11.8"/>',
    },
    {
      id: 'D', name: 'Row of spines',
      note: 'Four spines of different heights standing on a shelf.',
      svg: '<path d="M2.5 21h19"/><path d="M4.5 21V9h3v12M7.5 21V5.5h3.5V21M11 21v-9.5h3V21"/><path d="M16 21l1.8-11.5 3 .5-1.6 11"/>',
    },
    {
      id: 'E', name: 'Original spines (logo)',
      note: 'Three spines, one leaning, no shelf line: the previous icon, now used for missing covers.',
      svg: '<path d="M4 4h5v16H4zM10 4h5v16h-5zM16 5l4 1-3 15-4-1z"/>',
    },
    {
      id: 'F', name: 'Wall shelf with brackets',
      note: 'Two stacked books resting on a wall shelf with brackets.',
      svg: '<path d="M2 17h20M5.5 17v4M18.5 17v4"/><rect x="4" y="12" width="13" height="5" rx="1"/><rect x="6" y="7" width="10" height="5" rx="1"/><path d="M7 12v5M13.5 7v5"/>',
    },
    {
      id: 'G', name: 'Bookcase',
      note: 'Cabinet with two shelves of books (tried before).',
      svg: '<rect x="3" y="2.5" width="18" height="19" rx="1.5"/><path d="M3 12h18"/><path d="M7 12V6.5M10 12V5.5M15.5 12l-2-5.5"/><path d="M7 21.5V16M10.5 21.5V15.5M14 21.5V16.5M17.5 21.5V15.5"/>',
    },
    {
      id: 'H', name: 'Open book',
      note: 'An open book seen from the front. Reads as "reading" more than "shelves".',
      svg: '<path d="M12 6.5C10 5 7 4.5 3 5v13c4-.5 7 0 9 1.5 2-1.5 5-2 9-1.5V5c-4-.5-7 0-9 1.5z"/><path d="M12 6.5v13"/>',
    },
    {
      id: 'I', name: 'Book with bookmark',
      note: 'A closed book with a ribbon bookmark.',
      svg: '<path d="M5 19.5V4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5zM5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/><path d="M10 3v7l2-1.5 2 1.5V3"/>',
    },
    {
      id: 'J', name: 'Library building',
      note: 'Classic library front with columns. Reads as "library".',
      svg: '<path d="M3 9l9-5 9 5M4 9h16M6 9v9M10 9v9M14 9v9M18 9v9M3 21h18M4 18h16"/>',
    },
    {
      id: 'K', name: 'Stack, filled style',
      note: 'Solid books with cut-out bands: heavier, a different style from the other line icons.',
      svg: '<rect x="3" y="16.5" width="18" height="4.5" rx="1" fill="currentColor" stroke="none"/><rect x="5" y="11.5" width="15" height="4.5" rx="1" fill="currentColor" stroke="none"/><rect x="4" y="6.5" width="13" height="4.5" rx="1" fill="currentColor" stroke="none"/><path d="M7 16.5v4.5M16.5 11.5v4.5M7.5 6.5v4.5" stroke="var(--icon-cut)" stroke-width="1.5"/>',
    },
    {
      id: 'L', name: 'Stack, duotone style',
      note: 'Line stack with a soft tinted fill: lighter than filled, warmer than plain lines.',
      svg: '<g fill="currentColor" fill-opacity=".18"><rect x="3" y="16" width="18" height="5" rx="1"/><rect x="5" y="11" width="15" height="5" rx="1"/><rect x="4" y="6" width="13" height="5" rx="1"/></g><path d="M7 16v5M16.5 11v5M7.5 6v5"/>',
    },
  ];

  const icon = (inner, size) =>
    `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;

  // The other navigation icons, for context next to each option.
  const HOME = '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>';
  const YEAR = '<rect x="3" y="4.5" width="18" height="16.5" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><path d="M12 12l.88 2.29 2.45.13-1.9 1.54.63 2.37L12 17l-2.06 1.33.63-2.37-1.9-1.54 2.45-.13z" fill="currentColor" stroke-width="1"/>';

  document.getElementById('options').innerHTML = OPTIONS.map((option) => `
    <section class="card" aria-labelledby="opt-${option.id}">
      <h2 id="opt-${option.id}"><span>${option.id}</span>${option.name}</h2>
      <div class="big" style="color: var(--fg)">${icon(option.svg, 72)}</div>
      <div class="preview">
        <div class="side">
          <div class="item">${icon(HOME, 20)}Home</div>
          <div class="item">${icon(option.svg, 20)}Shelves</div>
          <div class="item active">${icon(option.svg, 20)}Shelves</div>
        </div>
        <div class="tabs">
          <div class="tab active">${icon(option.svg, 22)}Shelves</div>
          <div class="tab">${icon(YEAR, 22)}My Year</div>
        </div>
      </div>
      <p>${option.note}</p>
    </section>`).join('');

  const root = document.documentElement;
  const toggle = document.getElementById('themeToggle');
  const applyTheme = (theme) => {
    root.dataset.theme = theme;
    // Filled icons cut their spine bands out with the background color.
    root.style.setProperty('--icon-cut', theme === 'dark' ? '#141414' : '#F4F1EA');
    toggle.textContent = theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme';
  };
  toggle.addEventListener('click', () => applyTheme(root.dataset.theme === 'dark' ? 'light' : 'dark'));
  applyTheme(matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
</script>
</body>
</html>
